services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: classpulse
      POSTGRES_DB: classpulse
    ports:
      - "5432:5432"
    volumes:
      - classpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # roda a migration a cada start (idempotente) e sobe com --reload pra dev
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://classpulse:classpulse@db:5432/classpulse
      JWT_SECRET: LbMvHu-InH4eNRWxeTP8d7U3D5zqyASJS_3PO7F0jBM
      # navegadores modernos tratam localhost como contexto seguro, entao cookie Secure
      # funciona normalmente mesmo em http://localhost — deixa igual a prod
      REFRESH_COOKIE_SECURE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # .venv e o build do frontend moram fora de /app (UV_PROJECT_ENVIRONMENT e
      # FRONTEND_DIST_PATH no Dockerfile), então o bind mount acima nunca precisa
      # "esconder" nada aqui nem criar pasta dona-do-root no host.
      - classpulse_venv:/opt/venv
      - classpulse_frontend_dist:/opt/frontend_dist
    depends_on:
      db:
        condition: service_healthy

volumes:
  classpulse_pgdata:
  classpulse_venv:
  classpulse_frontend_dist:
