services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: classpulse
      POSTGRES_DB: classpulse
    ports:
      - "5432:5432"
    volumes:
      - classpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    # roda a migration a cada start (idempotente) e sobe com --reload pra dev
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://classpulse:classpulse@db:5432/classpulse
      JWT_SECRET: dev-secret-so-para-uso-local-nao-usar-em-prod
      # False aqui pq em dev local é http puro (sem HTTPS); em prod deixa True (default)
      REFRESH_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv # evita que o .venv do host (se existir) sobreponha o do container
    depends_on:
      db:
        condition: service_healthy

volumes:
  classpulse_pgdata:
